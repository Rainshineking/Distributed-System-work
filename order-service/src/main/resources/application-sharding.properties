# ShardingSphere-JDBC 分库分表配置

# 数据源配置
spring.shardingsphere.datasource.names=ds0,ds1

# 数据源 0（用户 ID 为偶数）
spring.shardingsphere.datasource.ds0.type=com.zaxxer.hikari.HikariDataSource
spring.shardingsphere.datasource.ds0.driver-class-name=com.mysql.cj.jdbc.Driver
spring.shardingsphere.datasource.ds0.jdbc-url=jdbc:mysql://localhost:3307/seckill_order_0?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.shardingsphere.datasource.ds0.username=root
spring.shardingsphere.datasource.ds0.password=verysecret

# 数据源 1（用户 ID 为奇数）
spring.shardingsphere.datasource.ds1.type=com.zaxxer.hikari.HikariDataSource
spring.shardingsphere.datasource.ds1.driver-class-name=com.mysql.cj.jdbc.Driver
spring.shardingsphere.datasource.ds1.jdbc-url=jdbc:mysql://localhost:3307/seckill_order_1?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.shardingsphere.datasource.ds1.username=root
spring.shardingsphere.datasource.ds1.password=verysecret

# 分片策略配置
# 按用户 ID 分库，按订单 ID 分表
spring.shardingsphere.rules.sharding.tables.orders.table-name=orders
spring.shardingsphere.rules.sharding.tables.orders.actual-data-nodes=ds$->{userId % 2}.orders_$->{orderId % 4}

# 数据库分片键
spring.shardingsphere.rules.sharding.database-strategy.standard.sharding-column=userId
spring.shardingsphere.rules.sharding.database-strategy.standard.sharding-algorithm-name=database-sharding-algorithm

# 表分片键
spring.shardingsphere.rules.sharding.tables.orders.table-strategy.standard.sharding-column=id
spring.shardingsphere.rules.sharding.tables.orders.table-strategy.standard.sharding-algorithm-name=table-sharding-algorithm

# 分片算法
spring.shardingsphere.rules.sharding.sharding-algorithms.database-sharding-algorithm.type=INLINE
spring.shardingsphere.rules.sharding.sharding-algorithms.database-sharding-algorithm.props.algorithm-expression=ds$->{userId % 2}

spring.shardingsphere.rules.sharding.sharding-algorithms.table-sharding-algorithm.type=INLINE
spring.shardingsphere.rules.sharding.sharding-algorithms.table-sharding-algorithm.props.algorithm-expression=orders_$->{id % 4}

# 分布式主键生成策略（使用雪花算法）
spring.shardingsphere.rules.sharding.tables.orders.key-generate-strategy.column=id
spring.shardingsphere.rules.sharding.tables.orders.key-generate-strategy.key-generator-name=snowflake

spring.shardingsphere.rules.sharding.key-generators.snowflake.type=SNOWFLAKE
spring.shardingsphere.rules.sharding.key-generators.snowflake.props.worker-id=1

# 显示 SQL
spring.shardingsphere.props.sql-show=true
