# Docker 环境配置
---
spring.config.activate.on-profile=docker

server.port=8080
spring.datasource.url=jdbc:mysql://mysql:3306/seckill?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=seckill
spring.datasource.password=secret
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.redis.host=redis
spring.redis.port=6379
spring.redis.password=
spring.redis.database=0

# JPA 配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.session.store-type=redis
spring.session.timeout=30m

# JWT 配置
jwt.secret=${JWT_SECRET:mySuperSecretKeyForJWTTokenGenerationAndValidationThatIsLongEnoughForHS512Algorithm2026}
jwt.expiration=86400000

# 管理端点
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# 日志配置
logging.level.com.example.usersystem=info
logging.level.org.springframework.security=info
