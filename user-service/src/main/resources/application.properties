server.port=8081
spring.application.name=user-service

# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3307/seckill?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=verysecret
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Redis 配置
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.database=0

spring.session.store-type=redis
spring.session.timeout=30m

# JWT 配置
jwt.secret=mySecretKeyForJWTTokenGenerationAndValidation123456789012345678901234567890
jwt.expiration=86400000

# 管理端点
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# 日志配置
logging.level.com.example.usersystem=debug
logging.level.org.springframework.security=debug
