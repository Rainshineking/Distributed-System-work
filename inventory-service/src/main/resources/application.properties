# 默认配置（本地开发）
server.port=8084
spring.application.name=inventory-service

spring.datasource.url=jdbc:mysql://localhost:3307/seckill?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=verysecret
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.database=0

spring.redisson.host=redis://localhost:6379

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Docker 环境配置
---
spring.config.activate.on-profile=docker

server.port=8080
spring.datasource.url=jdbc:mysql://mysql:3306/seckill?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=seckill
spring.datasource.password=secret
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.redis.host=redis
spring.redis.port=6379
spring.redis.password=
spring.redis.database=0

spring.redisson.host=${SPRING_REDISSON_HOST:redis://redis:6379}

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

logging.level.com.example.inventoryservice=info
