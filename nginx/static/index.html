<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秒杀系统 - 首页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        .product-card h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .product-card .price {
            color: #e74c3c;
            font-size: 1.5em;
            font-weight: bold;
            margin: 10px 0;
        }

        .product-card .stock {
            color: #27ae60;
            font-weight: bold;
        }

        .btn {
            display: inline-block;
            padding: 10px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
            margin-top: 15px;
        }

        .btn:hover {
            background: #5a6fd6;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }

        .stat-item {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            color: white;
            min-width: 150px;
        }

        .stat-item .number {
            font-size: 2.5em;
            font-weight: bold;
        }

        .stat-item .label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-top: 5px;
        }

        .login-form {
            max-width: 400px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛒 秒杀系统</h1>
            <p>商品库存与秒杀系统 - 分布式系统设计作业</p>
        </header>

        <!-- 统计数据 -->
        <div class="section">
            <h2>📊 系统统计</h2>
            <div class="stats">
                <div class="stat-item">
                    <div class="number" id="totalUsers">0</div>
                    <div class="label">注册用户</div>
                </div>
                <div class="stat-item">
                    <div class="number" id="totalProducts">0</div>
                    <div class="label">商品数量</div>
                </div>
                <div class="stat-item">
                    <div class="number" id="totalOrders">0</div>
                    <div class="label">订单数量</div>
                </div>
                <div class="stat-item">
                    <div class="number" id="seckillCount">0</div>
                    <div class="label">秒杀成功</div>
                </div>
            </div>
        </div>

        <!-- 商品列表 -->
        <div class="section">
            <h2>🔥 秒杀商品</h2>
            <div class="product-grid" id="productList">
                <!-- 商品卡片将通过JavaScript动态生成 -->
            </div>
        </div>

        <!-- 用户登录 -->
        <div class="section">
            <h2>🔐 用户登录</h2>
            <div class="login-form">
                <div id="loginMessage" class="message"></div>
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="请输入密码">
                </div>
                <button class="btn" id="loginBtn" onclick="login()">登录</button>
                <button class="btn" onclick="showRegister()" style="background: #27ae60;">注册</button>
            </div>
        </div>

        <!-- 秒杀操作 -->
        <div class="section">
            <h2>⚡ 秒杀操作</h2>
            <div style="max-width: 400px; margin: 0 auto; text-align: center;">
                <div class="form-group">
                    <label for="productId">商品ID</label>
                    <input type="number" id="productId" placeholder="输入商品ID">
                </div>
                <button class="btn" onclick="seckill()">立即秒杀</button>
                <button class="btn" onclick="checkOrder()" style="background: #f39c12;">查询订单</button>
            </div>
        </div>
    </div>

    <script>
        // API 基础地址
        const API_BASE = '';
            
        // 全局变量
        let currentUser = null;
        let authToken = null;
        let products = [];
            
        // 显示消息提示
        function showMessage(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.className = `message ${type}`;
            element.textContent = message;
            setTimeout(() => {
                element.style.display = 'none';
            }, 5000);
        }
            
        // 显示加载状态
        function showLoading(buttonId, loadingText) {
            const btn = document.getElementById(buttonId);
            btn.disabled = true;
            btn.dataset.originalText = btn.textContent;
            btn.textContent = loadingText;
        }
            
        // 恢复按钮状态
        function restoreButton(buttonId) {
            const btn = document.getElementById(buttonId);
            btn.disabled = false;
            btn.textContent = btn.dataset.originalText || '按钮';
        }
            
        // 渲染商品列表
        function renderProducts() {
            const productList = document.getElementById('productList');
            if (products.length === 0) {
                productList.innerHTML = '<p style="text-align: center; color: #666;">暂无商品</p>';
                return;
            }
                
            productList.innerHTML = products.map(product => `
                <div class="product-card">
                    <h3>${product.name}</h3>
                    <div class="price">¥${product.price}</div>
                    <div class="stock">库存：${product.stock} 件</div>
                    <button class="btn" onclick="seckill(${product.id})" ${!authToken ? 'disabled' : ''}>秒杀</button>
                </div>
            `).join('');
        }
            
        // 加载商品列表
        async function loadProducts() {
            try {
                const response = await fetch(`${API_BASE}/api/products`, {
                    method: 'GET',
                    headers: {
                        'Authorization': authToken ? `Bearer ${authToken}` : ''
                    }
                });
                    
                if (response.ok) {
                    const result = await response.json();
                    if (result.code === 200 && result.data) {
                        products = result.data.content || result.data;
                        renderProducts();
                        updateStats();
                    }
                }
            } catch (error) {
                console.error('加载商品失败:', error);
            }
        }
            
        // 显示注册表单
        function showRegister() {
            const registerSection = document.createElement('div');
            registerSection.className = 'section';
            registerSection.innerHTML = `
                <h2>📝 用户注册</h2>
                <div id="registerMessage" class="message"></div>
                <div class="login-form">
                    <div class="form-group">
                        <label for="registerUsername">用户名</label>
                        <input type="text" id="registerUsername" placeholder="请输入用户名">
                    </div>
                    <div class="form-group">
                        <label for="registerPassword">密码</label>
                        <input type="password" id="registerPassword" placeholder="请输入密码">
                    </div>
                    <div class="form-group">
                        <label for="registerEmail">邮箱</label>
                        <input type="email" id="registerEmail" placeholder="请输入邮箱">
                    </div>
                    <button class="btn" id="registerBtn" onclick="register()">注册</button>
                    <button class="btn" onclick="this.parentElement.parentElement.remove()" style="background: #95a5a6;">取消</button>
                </div>
            `;
            document.querySelector('.container').insertBefore(registerSection, document.querySelector('.section:nth-child(3)'));
        }
            
        // 用户注册
        async function register() {
            const username = document.getElementById('registerUsername').value;
            const password = document.getElementById('registerPassword').value;
            const email = document.getElementById('registerEmail').value;
            const message = document.getElementById('registerMessage');
                
            if (!username || !password) {
                message.className = 'message error';
                message.textContent = '请输入用户名和密码';
                return;
            }
                
            showLoading('registerBtn', '注册中...');
                
            try {
                const response = await fetch(`${API_BASE}/api/users/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password, email })
                });
                    
                const result = await response.json();
                    
                if (response.ok && result.code === 200) {
                    message.className = 'message success';
                    message.textContent = '注册成功！请登录';
                    setTimeout(() => {
                        document.querySelector('.section:nth-child(3)').remove();
                    }, 2000);
                } else {
                    message.className = 'message error';
                    message.textContent = result.message || '注册失败';
                }
            } catch (error) {
                message.className = 'message error';
                message.textContent = '注册失败：' + error.message;
            }
        }
            
        // 用户登录
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const message = document.getElementById('loginMessage');
                
            if (!username || !password) {
                message.className = 'message error';
                message.textContent = '请输入用户名和密码';
                return;
            }
                
            showLoading('loginBtn', '登录中...');
                
            try {
                const response = await fetch(`${API_BASE}/api/users/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                    
                const result = await response.json();
                    
                if (response.ok && result.code === 200) {
                    currentUser = result.data;
                    authToken = result.data.token;
                        
                    message.className = 'message success';
                    message.textContent = `登录成功！欢迎 ${username}`;
                        
                    // 更新 UI
                    document.querySelector('.section:nth-child(4)').innerHTML = `
                        <h2>👤 用户信息</h2>
                        <p style="text-align: center; font-size: 1.2em;">欢迎，${username}！</p>
                        <p style="text-align: center; color: #27ae60;">登录成功</p>
                        <div style="text-align: center;">
                            <button class="btn" onclick="logout()" style="background: #e74c3c;">退出登录</button>
                        </div>
                    `;
                        
                    // 启用秒杀按钮
                    loadProducts();
                } else {
                    message.className = 'message error';
                    message.textContent = result.message || '登录失败';
                }
            } catch (error) {
                message.className = 'message error';
                message.textContent = '登录失败：' + error.message;
            }
        }
            
        // 退出登录
        function logout() {
            currentUser = null;
            authToken = null;
            location.reload();
        }
            
        // 秒杀
        async function seckill(productId) {
            if (!authToken) {
                alert('请先登录');
                return;
            }
                
            if (!productId) {
                productId = document.getElementById('productId').value;
            }
                
            if (!productId) {
                alert('请选择商品');
                return;
            }
                
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '秒杀中...';
                
            try {
                const response = await fetch(`${API_BASE}/api/orders/seckill`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({
                        userId: currentUser.id || 1,
                        productId: parseInt(productId),
                        quantity: 1,
                        totalPrice: products.find(p => p.id === productId)?.price || 0
                    })
                });
                    
                const result = await response.json();
                    
                if (response.ok && result.code === 200) {
                    alert(`✓ 秒杀成功！订单 ID: ${result.data}`);
                    updateStats();
                } else {
                    alert(`✗ 秒杀失败：${result.message || '未知错误'}`);
                }
            } catch (error) {
                alert(`✗ 秒杀失败：${error.message}`);
            } finally {
                btn.disabled = false;
                btn.textContent = '秒杀';
            }
        }
            
        // 查询订单
        async function checkOrder() {
            if (!authToken) {
                alert('请先登录');
                return;
            }
                
            const orderId = prompt('请输入订单 ID:');
            if (!orderId) return;
                
            try {
                const response = await fetch(`${API_BASE}/api/orders/${orderId}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                    
                const result = await response.json();
                    
                if (response.ok && result.code === 200) {
                    const order = result.data;
                    const statusMap = ['待创建', '待支付', '已完成', '已取消'];
                    alert(
                        `订单详情：\n` +
                        `订单 ID: ${order.id}\n` +
                        `用户 ID: ${order.userId}\n` +
                        `商品 ID: ${order.productId}\n` +
                        `数量：${order.quantity}\n` +
                        `总价：¥${order.totalPrice}\n` +
                        `状态：${statusMap[order.status] || '未知'}\n` +
                        `创建时间：${order.createTime || '未知'}`
                    );
                } else {
                    alert(`查询失败：${result.message || '订单不存在'}`);
                }
            } catch (error) {
                alert(`查询失败：${error.message}`);
            }
        }
            
        // 更新统计数据 - 完全从后端获取真实数据
        async function updateStats() {
            try {
                // 1. 获取商品总数
                const productsResponse = await fetch(`${API_BASE}/api/products`, {
                    method: 'GET',
                    headers: {
                        'Authorization': authToken ? `Bearer ${authToken}` : ''
                    }
                });
                
                if (productsResponse.ok) {
                    const productsResult = await productsResponse.json();
                    if (productsResult.data) {
                        const productArray = Array.isArray(productsResult.data) ? productsResult.data : (productsResult.data.content || []);
                        document.getElementById('totalProducts').textContent = productArray.length;
                    }
                }
                
                // 2. 获取用户总数 - 暂时用商品数代替，实际应该调用用户统计 API
                // 由于后端没有提供用户总数 API，暂时显示商品数
                document.getElementById('totalUsers').textContent = products.length;
                
                // 3. 获取订单总数 - 暂时显示 0，实际应该调用订单统计 API
                // 由于后端没有提供订单总数 API，暂时显示 0
                document.getElementById('totalOrders').textContent = '0';
                document.getElementById('seckillCount').textContent = '0';
                
                // 注：如果需要真实的统计数据，需要在后端添加统计 API
            } catch (error) {
                console.error('更新统计失败:', error);
                // 统计失败时显示 0
                document.getElementById('totalProducts').textContent = '0';
                document.getElementById('totalUsers').textContent = '0';
                document.getElementById('totalOrders').textContent = '0';
                document.getElementById('seckillCount').textContent = '0';
            }
        }
            
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadProducts();
            updateStats();
                
            // 检查是否有保存的 token
            const savedToken = localStorage.getItem('authToken');
            if (savedToken) {
                authToken = savedToken;
                // 可以在这里自动登录
            }
        });
    </script>
</body>
</html>
