# 默认配置（本地开发）
server.port=8083
spring.application.name=product-service

spring.datasource.url=jdbc:mysql://localhost:3307/seckill?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=verysecret
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.database=0

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Docker 环境配置
---
spring.config.activate.on-profile=docker

server.port=8080

# 数据源配置（使用主库）
spring.datasource.url=jdbc:mysql://mysql-master:3306/seckill?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=seckill
spring.datasource.password=secret
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis 配置
spring.redis.host=redis
spring.redis.port=6379
spring.redis.password=
spring.redis.database=0

# ElasticSearch 配置
spring.elasticsearch.uris=http://elasticsearch:9200
# 禁用 Elasticsearch 自动索引创建
spring.data.elasticsearch.client.reactive.max-in-memory-size=-1

# JPA 配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 管理端点
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# 日志配置
logging.level.com.example.productservice=info
logging.level.org.springframework.security=info
